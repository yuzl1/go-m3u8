name: Build and Push Docker Image

on:
  push:
    branches: [master, agent]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # N_m3u8DL-RE 的下载地址用认证过的 GitHub API 解析，
      # 避免 Dockerfile 里匿名调用 API 在 CI 共享 IP 上触发限流。
      - name: Resolve N_m3u8DL-RE asset URLs
        id: nm3u8dl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          X64=$(gh api repos/nilaoda/N_m3u8DL-RE/releases/latest \
            --jq '.assets[] | select(.name | test("linux-x64")) | .browser_download_url' | head -1)
          ARM64=$(gh api repos/nilaoda/N_m3u8DL-RE/releases/latest \
            --jq '.assets[] | select(.name | test("linux-arm64")) | .browser_download_url' | head -1)
          [ -n "$X64" ] || { echo "linux-x64 asset not found"; exit 1; }
          echo "x64=$X64" >> "$GITHUB_OUTPUT"
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"
          echo "Resolved x64: $X64"
          echo "Resolved arm64: $ARM64"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/go-m3u8
          tags: |
            # master 分支 → latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            # 分支名 → agent
            type=ref,event=branch
            # 提交 SHA
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NM3U8DL_URL_X64=${{ steps.nm3u8dl.outputs.x64 }}
            NM3U8DL_URL_ARM64=${{ steps.nm3u8dl.outputs.arm64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
