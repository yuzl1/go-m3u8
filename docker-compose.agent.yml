# Agent 节点部署文件 —— 用于没有公网 IP 的服务器（如家里 NAS）
#
# 部署步骤：
#   1. 在主服务网页「🤖 Agent 管理」标签页查看共享 Token
#   2. 只拷贝这个文件到 Agent 服务器（镜像直接从 Docker Hub 拉取）
#   3. 修改下面的 AGENT_SERVER 为主服务地址、AGENT_TOKEN 为共享 Token
#   4. docker compose -f docker-compose.agent.yml up -d
#
# Agent 模式特点：
#   - 所有连接由 Agent 主动拨出（主服务无法主动连 Agent）
#   - 下载在主服务完成后，主服务自动推送传输任务
#   - Agent 通过 HTTP 从主服务拉取文件并保存到 AGENT_DIR
#   - 同步完成后主服务删除本地文件以释放硬盘
services:
  go-m3u8-agent:
    # 与主服务同一个镜像（GitHub Actions 构建推送到 Docker Hub）
    image: ${DOCKERHUB_USER:-yu1998}/go-m3u8:latest
    container_name: go-m3u8-agent
    # ENTRYPOINT 已经是 go-m3u8，这里只传参数即可
    command: ["-agent"]
    environment:
      - AGENT_SERVER=ws://主服务器IP:5000/agent/ws
      - AGENT_TOKEN=替换为主服务页面显示的Token
      - AGENT_NAME=home-agent
      - AGENT_DIR=/downloads
      # 可选：传输也走 clash 机场线路（推荐——直连国际线路通常很慢）
      - AGENT_CLASH_SUBSCRIBE=https://xxx.com/api/v1/client/subscribe?token=xxx
      # 可选：多连接分块并发数（默认取主服务配置，越大对高延迟线路提速越明显）
      # - AGENT_CONNECTIONS=8
    volumes:
      - ./downloads:/downloads
    restart: unless-stopped
