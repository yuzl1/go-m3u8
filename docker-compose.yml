# 主服务部署：直接拉取 Docker Hub 镜像（GitHub Actions 自动构建推送）
# 如需本地构建：docker compose -f docker-compose.yml -f docker-compose.build.yml up -d
services:
  go-m3u8:
    image: ${DOCKERHUB_USER:-yu1998}/go-m3u8:latest
    container_name: go-m3u8
    ports:
      - "5000:8080"
    volumes:
      - ./downloads:/downloads
      - ./config:/config
    environment:
      - CONFIG_DIR=/config
    restart: unless-stopped
