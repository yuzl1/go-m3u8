version: "3.9"

services:
  go-m3u8:
    build:
      context: .
      args:
        NM3U8DL_VERSION: "0.6.0-beta"
    container_name: go-m3u8
    ports:
      - "5000:8080"
    volumes:
      - ./downloads:/downloads
      - ./config:/config
    environment:
      - CONFIG_DIR=/config
    restart: unless-stopped
